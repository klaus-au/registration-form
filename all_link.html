<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All link</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f3f4f6, #e5e7eb);
            color: #1f2937;
        }
        #errorMessage {
            color: #b91c1c;
            display: none;
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: #fee2e2;
            padding: 1rem;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            z-index: 1000;
        }
        #loadingSpinner {
            display: none;
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 50%;
            background: radial-gradient(circle, #3b82f6 10%, transparent 10.01%);
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
        }
        .product-card {
            background: white;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.15);
        }
        .action-button {
            position: relative;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .action-button::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.5), transparent 70%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .action-button:hover:not(.cursor-not-allowed)::after {
            opacity: 1;
        }
        .action-button:active {
            transform: scale(0.95);
        }
        .fade-in {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.5s ease forwards;
        }
        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }
        canvas#lights {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.2;
        }
        .search-bar {
            transition: box-shadow 0.3s ease;
        }
        .search-bar:focus-within {
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
        }
        .category-nav {
            scrollbar-width: thin;
        }
        .category-title {
            scroll-margin-top: 80px;
        }
    </style>
</head>
<body class="flex flex-col items-center min-h-screen p-4">
    <canvas id="lights"></canvas>
    
    <h1 class="text-3xl sm:text-4xl font-bold text-gray-900 mb-6 fade-in">All link</h1>

    <!-- 分類導航 -->
    <div id="categoryNav" class="w-full max-w-5xl mb-6 hidden">
        <div class="bg-white rounded-xl shadow-sm p-4">
            <p class="text-sm text-gray-500 mb-3">分類導航</p>
            <div id="navButtons" class="flex flex-wrap gap-2 category-nav"></div>
        </div>
    </div>

    <div class="w-full max-w-5xl mb-6">
        <div class="search-bar flex items-center bg-white rounded-lg shadow-sm p-2">
            <input id="searchInput" type="text" placeholder="搜尋連結..." class="flex-1 bg-transparent outline-none text-gray-700 px-2">
            <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
        </div>
    </div>

    <div id="errorMessage" class="text-sm sm:text-base">
        <span id="errorText"></span>
        <button onclick="document.getElementById('errorMessage').style.display = 'none'" class="absolute top-2 right-2 text-gray-500 hover:text-gray-700">✕</button>
    </div>

    <div id="loadingSpinner" class="mb-6"></div>
    <div id="contentContainer" class="w-full max-w-5xl"></div>

    <script>
        // Google Sheet 設定
        const spreadsheetId = '1P28ZlLqSFk64xTX9bVg2sSCOSj1kCp7blzBvIWfgT_w';
        const sheetName = 'Sheet1';
        const apiUrl = `https://docs.google.com/spreadsheets/d/${spreadsheetId}/gviz/tq?tqx=out:json&tq=SELECT%20*%20WHERE%20A%20IS%20NOT%20NULL&sheet=${encodeURIComponent(sheetName)}`;

        // 漂浮光點
        const canvas = document.getElementById('lights');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const lights = [];
        for (let i = 0; i < 50; i++) {
            lights.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 1.5 + 0.5,
                vx: Math.random() * 0.2 - 0.1,
                vy: Math.random() * 0.2 - 0.1
            });
        }
        function animateLights() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            lights.forEach(l => {
                l.x += l.vx;
                l.y += l.vy;
                if (l.x < 0 || l.x > canvas.width) l.vx *= -1;
                if (l.y < 0 || l.y > canvas.height) l.vy *= -1;
                ctx.beginPath();
                ctx.arc(l.x, l.y, l.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.fill();
            });
            requestAnimationFrame(animateLights);
        }
        animateLights();

        let allRows = [];

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        async function fetchSheetData() {
            const spinner = document.getElementById('loadingSpinner');
            spinner.style.display = 'block';
            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error(`HTTP 狀態碼：${response.status}`);
                
                const text = await response.text();
                const jsonString = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);/);
                if (!jsonString || !jsonString[1]) throw new Error('無效的回應');

                const data = JSON.parse(jsonString[1]);
                if (data.table && data.table.rows && data.table.rows.length > 1) {
                    allRows = data.table.rows;
                    renderAll();
                    document.getElementById('errorMessage').style.display = 'none';
                } else {
                    showError('工作表中無有效資料');
                }
            } catch (error) {
                showError(`載入失敗：${error.message}`);
                console.error(error);
            } finally {
                spinner.style.display = 'none';
            }
        }

        function getCategory(row) {
            return row.c[1]?.v ? row.c[1].v.trim() : '未分類';
        }

        function groupByCategory(rows) {
            const groups = {};
            rows.slice(1).forEach(row => {
                const category = getCategory(row);
                if (!groups[category]) groups[category] = [];
                groups[category].push(row);
            });

            const sortedCategories = Object.keys(groups).sort((a, b) => {
                if (a === '未分類') return -1;
                if (b === '未分類') return 1;
                return a.localeCompare(b);
            });

            return { groups, sortedCategories };
        }

        function createCategoryNav(sortedCategories) {
            const navContainer = document.getElementById('navButtons');
            navContainer.innerHTML = '';

            sortedCategories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `px-4 py-2 text-sm font-medium rounded-full transition-colors ${cat === '未分類' ? 'bg-gray-700 text-white' : 'bg-white hover:bg-gray-100 border border-gray-200'}`;
                btn.textContent = cat;
                btn.onclick = () => {
                    document.getElementById(`cat-${encodeURIComponent(cat)}`).scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                };
                navContainer.appendChild(btn);
            });

            document.getElementById('categoryNav').classList.remove('hidden');
        }

        function renderAll() {
            const container = document.getElementById('contentContainer');
            container.innerHTML = '';

            const { groups, sortedCategories } = groupByCategory(allRows);

            createCategoryNav(sortedCategories);

            sortedCategories.forEach((category, catIndex) => {
                const section = document.createElement('div');
                section.id = `cat-${encodeURIComponent(category)}`;
                section.className = 'mb-12';

                const title = document.createElement('h2');
                title.className = 'category-title text-2xl font-bold text-gray-800 mb-6 flex items-center gap-3';
                title.innerHTML = `
                    <span class="inline-block w-3 h-8 bg-blue-500 rounded"></span>
                    ${escapeHtml(category)}
                `;
                section.appendChild(title);

                const grid = document.createElement('div');
                grid.className = 'grid gap-6 sm:grid-cols-2 lg:grid-cols-3';

                groups[category].forEach((row, index) => {
                    const label = row.c[0]?.v;
                    if (!label) return;

                    const card = document.createElement('div');
                    card.className = 'product-card p-5 fade-in';
                    card.style.animationDelay = `${index * 0.08}s`;

                    const titleEl = document.createElement('h3');
                    titleEl.className = 'text-lg font-semibold text-gray-900 mb-4';
                    titleEl.innerHTML = escapeHtml(label);

                    const btnContainer = document.createElement('div');
                    btnContainer.className = 'flex flex-wrap gap-2';

                    // Form (C欄)
                    addButton(btnContainer, row, 2, 'Form', 'bg-blue-500 hover:bg-blue-600', 'M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l3.414 3.414a1 1 0 01.293.707V19a2 2 0 01-2 2z');
                    
                    // Sheet (D欄)
                    addButton(btnContainer, row, 3, 'Sheet', 'bg-green-500 hover:bg-green-600', 'M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l3.414 3.414a1 1 0 01.293.707V19a2 2 0 01-2 2z');

                    // 自訂連結（E欄開始）—— 只顯示有連結的按鈕
                    for (let i = 4; i < row.c.length; i++) {
                        const header = allRows[0].c[i]?.v || `連結${i-3}`;
                        addButton(btnContainer, row, i, header, 
                            ['bg-purple-500 hover:bg-purple-600', 'bg-indigo-500 hover:bg-indigo-600', 'bg-red-500 hover:bg-red-600', 
                             'bg-teal-500 hover:bg-teal-600', 'bg-orange-500 hover:bg-orange-600'][ (i-4) % 5 ], 
                            'M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3');
                    }

                    card.appendChild(titleEl);
                    card.appendChild(btnContainer);
                    grid.appendChild(card);
                });

                section.appendChild(grid);
                container.appendChild(section);
            });
        }

        // 修改重點：只有有連結時才建立按鈕
        function addButton(container, row, colIndex, name, colorClass, iconPath) {
            const cell = row.c[colIndex];
            const link = cell ? cell.v : null;

            // 如果沒有連結，則不建立按鈕（自訂連結專用）
            if (!link || !link.toString().trim()) {
                return;
            }

            const btn = document.createElement('a');
            btn.className = `action-button py-2.5 px-5 rounded-xl text-white text-sm flex items-center justify-center gap-2 text-center ${colorClass}`;
            
            btn.innerHTML = `
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${iconPath}" />
                </svg>
                <span>${escapeHtml(name)}</span>
            `;

            const cleanLink = link.toString().trim();
            btn.href = cleanLink.startsWith('http') ? cleanLink : `https://${cleanLink}`;
            btn.target = '_blank';
            btn.rel = 'noopener noreferrer';

            container.appendChild(btn);
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            document.getElementById('errorText').textContent = message;
            errorDiv.style.display = 'block';
        }

        // 搜尋功能（目前簡化版）
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            
            if (!query) {
                renderAll();
                return;
            }

            const filteredRows = [allRows[0], ...allRows.slice(1).filter(row => 
                (row.c[0]?.v || '').toLowerCase().includes(query)
            )];

            document.getElementById('categoryNav').classList.add('hidden');
            
            const container = document.getElementById('contentContainer');
            container.innerHTML = `<div class="text-center py-8 text-gray-500">搜尋「${escapeHtml(query)}」的結果：</div>`;

            if (filteredRows.length > 1) {
                const grid = document.createElement('div');
                grid.className = 'grid gap-6 sm:grid-cols-2 lg:grid-cols-3';
                
                filteredRows.slice(1).forEach((row, index) => {
                    const label = row.c[0]?.v;
                    if (!label) return;

                    const card = document.createElement('div');
                    card.className = 'product-card p-5';
                    
                    const titleEl = document.createElement('h3');
                    titleEl.className = 'text-lg font-semibold text-gray-900 mb-4';
                    titleEl.innerHTML = escapeHtml(label);

                    const btnContainer = document.createElement('div');
                    btnContainer.className = 'flex flex-wrap gap-2';

                    addButton(btnContainer, row, 2, 'Form', 'bg-blue-500 hover:bg-blue-600', 'M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l3.414 3.414a1 1 0 01.293.707V19a2 2 0 01-2 2z');
                    addButton(btnContainer, row, 3, 'Sheet', 'bg-green-500 hover:bg-green-600', 'M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l3.414 3.414a1 1 0 01.293.707V19a2 2 0 01-2 2z');

                    for (let i = 4; i < row.c.length; i++) {
                        const header = allRows[0].c[i]?.v || `連結${i-3}`;
                        addButton(btnContainer, row, i, header, 
                            ['bg-purple-500 hover:bg-purple-600', 'bg-indigo-500 hover:bg-indigo-600', 'bg-red-500 hover:bg-red-600', 
                             'bg-teal-500 hover:bg-teal-600', 'bg-orange-500 hover:bg-orange-600'][ (i-4) % 5 ], 
                            'M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3');
                    }

                    card.appendChild(titleEl);
                    card.appendChild(btnContainer);
                    grid.appendChild(card);
                });
                
                container.appendChild(grid);
            }
        });

        // 初始載入
        fetchSheetData();
    </script>
</body>
</html>
